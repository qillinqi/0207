<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的第一個網頁 - 150度扇面動畫</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            min-height: 100vh;
        }

        /* 1. 全螢幕加載遮罩 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        /* 加載完成隱藏 */
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* 2. 旋轉容器 */
        .fan-canvas {
            width: 140px;
            height: 140px;
            position: relative;
            animation: rotate360 2.5s linear infinite;
        }

        /* 3. 150度開角扇面（無把手） */
        .single-fan-surface {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 140px;
            height: 70px;
            background: linear-gradient(135deg, #f5e6ca 0%, #d4af37 100%);
            
            /* 上方圓弧 */
            border-radius: 70px 70px 0 0;
            
            /* 精準切出 150 度的扇形角度 (兩側各裁掉 15 度) */
            clip-path: polygon(13.4% 0%, 86.6% 0%, 100% 100%, 0% 100%);
            
            transform: translate(-50%, 0);
            transform-origin: bottom center; /* 旋轉中心點在底部中心 */
        }

        /* 4. 360度旋轉動畫 */
        @keyframes rotate360 {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 30px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #d4af37;
        }

        /* 5. 主要網頁內容區 */
        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. 加載動畫區塊 -->
    <div id="loader">
        <div class="fan-canvas">
            <div class="single-fan-surface"></div>
        </div>
        <div class="loading-text">網頁載入中...</div>
    </div>

    <!-- 2. 正式網頁內容 -->
    <div class="main-content">
        <h1>歡迎來到我的網站！</h1>
        <p>150度經典扇面旋轉完成，順利進入主頁面！</p>
    </div>

    <!-- 3. JavaScript：控制轉完一圈後進入頁面 -->
    <script>
        setTimeout(function() {
            const loader = document.getElementById('loader');
            loader.classList.add('hidden');
        }, 2500);
    </script>

</body>
</html>
